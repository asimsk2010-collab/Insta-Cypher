name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: shellcheck insta.sh
      - name: Bash syntax check
        run: bash -n insta.sh
      - name: Check required files
        run: |
          if [ -f default-passwords.lst ]; then echo "default-passwords.lst present"; else echo "WARNING: default-passwords.lst missing"; fi
